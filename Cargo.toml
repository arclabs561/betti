[package]
name = "betti"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Persistent homology over GF(2): boundary matrix reduction, clearing, Betti numbers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/betti"
homepage = "https://docs.rs/betti"
documentation = "https://docs.rs/betti"
readme = "README.md"
keywords = ["persistent-homology", "topology", "betti", "gf2", "filtration"]
categories = ["science", "algorithms"]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[workspace]

[dependencies]

[dev-dependencies]
# Differential oracle for the persistence pairs; tests only. Default features
# are off so the Python bindings, serde and local thread pool are not built.
lophat = { version = "0.14", default-features = false }
# Benchmarks only. 0.5 is the newest line whose rust-version fits the MSRV;
# plotting and rayon are off to keep the dev tree small.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "reduction"
harness = false
